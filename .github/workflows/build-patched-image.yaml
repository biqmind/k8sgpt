name: Build ConfigMap-usage-disabled binaries

# A normal GitHub "Sync fork" update produces a push to main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patched-binaries-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.repository == 'biqmind/k8sgpt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out synced source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Apply ConfigMap usage patch
        run: |
          git apply --check patches/disable-configmap-usage.patch
          git apply patches/disable-configmap-usage.patch
          git diff --check

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test patched ConfigMap analyzer
        run: go test ./pkg/analyzer -run '^TestConfigMapAnalyzer' -count=1

      - name: Build patched binaries
        run: |
          set -euo pipefail
          VERSION="no-configmap-usage-${GITHUB_SHA:0:12}"
          DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.date=${DATE}"
          mkdir -p dist
          for arch in amd64 arm64 arm ppc64le s390x; do
            echo "Building linux/${arch}"
            goarm=""
            if [ "$arch" = "arm" ]; then goarm=7; fi
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" GOARM="$goarm" \
              go build -trimpath -ldflags "$LDFLAGS" -o "dist/k8sgpt_linux_${arch}" ./
          done
          (cd dist && sha256sum k8sgpt_linux_* > checksums.txt)
          cat dist/checksums.txt

      - name: Smoke check amd64 binary
        run: ./dist/k8sgpt_linux_amd64 version

      - name: Upload binaries artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k8sgpt-no-configmap-usage-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="K8sGPT binaries built from ${GITHUB_SHA} with ConfigMap usage findings disabled globally; other checks retain upstream behavior."
          commit_tag="no-configmap-usage-${GITHUB_SHA}"
          rolling_tag="no-configmap-usage"

          gh release create "$commit_tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$commit_tag" \
            --notes "$notes" \
            --latest=false

          gh release delete "$rolling_tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$rolling_tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$rolling_tag (rolling)" \
            --notes "Rolling release. $notes" \
            --latest=false

      - name: Record published binaries
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download"
          {
            echo '### Patched K8sGPT binaries'
            echo '- ConfigMap usage findings are disabled globally; other checks retain upstream behavior.'
            echo ''
            echo '| Arch | Rolling | Per-commit |'
            echo '| --- | --- | --- |'
            for arch in amd64 arm64 arm ppc64le s390x; do
              echo "| ${arch} | ${base}/no-configmap-usage/k8sgpt_linux_${arch} | ${base}/no-configmap-usage-${GITHUB_SHA}/k8sgpt_linux_${arch} |"
            done
            echo "| checksums | ${base}/no-configmap-usage/checksums.txt | ${base}/no-configmap-usage-${GITHUB_SHA}/checksums.txt |"
          } >> "$GITHUB_STEP_SUMMARY"
